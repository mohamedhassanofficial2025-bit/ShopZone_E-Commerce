<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" routerLink="/products">ShopZone</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">

            <!-- LEFT SIDE LINKS -->
            <div *ngIf="isLoggedIn()" class="navbar-nav gap-3">
                <a class="nav-link" routerLink="/home">Home</a>
                <a class="nav-link" routerLink="/products">Products</a>
                <a class="nav-link" routerLink="/cart">🛒 Cart</a>
                <a class="nav-link" routerLink="/orders">Orders</a>
            </div>

            <!-- RIGHT SIDE -->
            <div class="ms-auto d-flex align-items-center gap-3">

                <!-- Logged IN -->
                <ng-container *ngIf="isLoggedIn()">

                    <!-- User Icon + Name -->
                    <div class="d-flex align-items-center gap-2 px-3 py-1 rounded bg-light shadow-sm">
                        <i class="bi bi-person-circle fs-5"></i>
                        <span class="fw-semibold">
                            {{ currentUser?.name }}
                        </span>
                    </div>

                    <!-- Profile -->
                    <a class="btn btn-outline-primary btn-sm" routerLink="/profile">
                        Profile
                    </a>

                    <!-- Logout -->
                    <button class="btn btn-danger btn-sm" (click)="logout()">
                        Logout
                    </button>

                </ng-container>

                <!-- Logged OUT -->
                <ng-container *ngIf="!isLoggedIn()">
                    <a class="btn btn-outline-primary btn-sm" routerLink="/login">Login</a>
                    <a class="btn btn-primary btn-sm" routerLink="/register">Register</a>
                </ng-container>

            </div>
        </div>
    </div>
</nav>
