<div class="profile-wrapper d-flex justify-content-center align-items-center">

    <div class="profile-card text-center">

        <img class="profile-img" src="https://ui-avatars.com/api/?name=John+Doe&background=random" alt="User avatar" />

        <h3 class="mt-3">{{ currentUser.name }}</h3>

        <p class="text-muted mb-1">{{ currentUser.email }}</p>

        <span class="role-badge">{{ currentUser.role }}</span>

        <button class="btn btn-danger mt-3 w-100" (click)="logout()">
            Logout
        </button>

    </div>

</div>
