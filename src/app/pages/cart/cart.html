@if (NoCarts == 0) {
<div class="empty-cart">
    <h3>No items found 🛒</h3>
    <a routerLink="/products" class="btn btn-primary">
        Go shopping
    </a>
</div>
}
@else {

<div class="cart-container">

    <div class="cart-header">
        <h3>Your Cart</h3>
    </div>

    <div class="cart-table">

        <div class="cart-row cart-head">
            <div>Product</div>
            <div>Price</div>
            <div>Subtotal</div>
            <div>Quantity</div>
            <div>Action</div>
        </div>

        @for (item of items; track item.id) {
        <div class="cart-row">

            <div class="product-name">
                {{ item.name }}
            </div>

            <div>
                {{ item.price | currency }}
            </div>

            <div class="fw-bold">
                {{ item.quantity * item.price | currency }}
            </div>

            <div>
                <input type="number" min="1" class="qty-input" [(ngModel)]="item.quantity"
                    (ngModelChange)="changeQuantity(item, $event)" />
            </div>

            <div>
                <button class="btn btn-danger btn-sm" (click)="remove(item.id)">
                    Remove
                </button>
            </div>

        </div>
        }

    </div>

    <div class="text-center mb-3" >
        <button class="btn btn-primary" (click)="AddOrder()">checkout {{getTotal() | currency}} </button>
    </div>
</div>

}
